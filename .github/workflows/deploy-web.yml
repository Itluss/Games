# PUBLICATION WEB DU JEU — barrières en parallèle, puis export et déploiement.
#
# POURQUOI CE FICHIER A ÉTÉ REMIS À PLAT. Les barrières s'exécutaient à la
# queue leu leu dans un seul travail : leur temps s'ADDITIONNAIT. À six
# barrières, dont une de deux minutes, le cycle atteignait cinq minutes —
# et comme chaque correction demande une publication, ces minutes se
# payaient à chaque aller-retour.
#
# Elles tournent maintenant de front. Le temps d'attente n'est plus leur
# somme mais la plus lente d'entre elles.
#
# La logique de jugement — compilation, exécution effective, comptage des
# échecs — vivait recopiée dans chaque étape. Elle est désormais dans
# `outils_dev/barriere.sh`, en un seul exemplaire.
#
# PRÉREQUIS CÔTÉ DÉPÔT : Settings → Pages → Source = « GitHub Actions ».
name: Publier le jeu sur le web

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "arena-rush/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"

jobs:
  # --- LES BARRIÈRES, TOUTES DE FRONT ------------------------------------
  verifier:
    runs-on: ubuntu-latest
    strategy:
      # UN ÉCHEC N'ARRÊTE PAS LES AUTRES. Savoir qu'une seule barrière a
      # cédé, ou que trois ont cédé ensemble, ne demande pas le même
      # diagnostic — et l'information ne coûte rien puisqu'elles tournent
      # déjà en parallèle.
      fail-fast: false
      matrix:
        include:
          - nom: Commandes
            scene: res://outils_dev/test_commandes.tscn
            rendu: true
          - nom: Plan du monde
            scene: res://outils_dev/test_arene.tscn
            rendu: false
          - nom: Dégagement de la caméra
            scene: res://outils_dev/sonde_occlusion.tscn
            rendu: false
          - nom: Couture du monde
            scene: res://outils_dev/sonde_couture.tscn
            rendu: true
          - nom: Interactions à travers la limite
            scene: res://outils_dev/test_enroulement.tscn
            rendu: true
          - nom: Boucle persistante
            scene: res://outils_dev/test_arene_persistante.tscn
            rendu: true
          - nom: Progression
            scene: res://outils_dev/test_progression.tscn
            rendu: false
          - nom: Stabilité de la scène
            scene: res://outils_dev/sonde_violet.tscn
            rendu: false
    name: ${{ matrix.nom }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/moteur
      - name: Vérifier
        run: |
          if [ "${{ matrix.rendu }}" = "true" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
            arena-rush/outils_dev/barriere.sh "${{ matrix.scene }}" \
              "${{ matrix.nom }}" --rendu
          else
            arena-rush/outils_dev/barriere.sh "${{ matrix.scene }}" \
              "${{ matrix.nom }}"
          fi

  # --- LA SAUVEGARDE SURVIT-ELLE À UN REDÉMARRAGE ? ----------------------
  #
  # Deux processus, donc pas une simple barrière : on écrit dans l'un et on
  # relit dans l'autre. Une progression qui ne se recharge pas est un défaut
  # invisible en jouant — tout paraît marcher, et la perte ne se découvre
  # qu'à la session suivante.
  sauvegarde:
    runs-on: ubuntu-latest
    name: Sauvegarde
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/moteur
      - name: Écrire puis relire
        run: |
          set -uo pipefail
          ~/godot-bin/godot --headless --path arena-rush \
            res://outils_dev/test_progression.tscn -- --ecrire 2>&1 | tee p.log || true
          ~/godot-bin/godot --headless --path arena-rush \
            res://outils_dev/test_progression.tscn -- --relire 2>&1 | tee -a p.log || true
          if ! grep -q "échec(s)" p.log; then
            echo "::error::La sauvegarde ne s'est pas testée."
            exit 1
          fi
          grep -E "^\s+\[(OK|ÉCHEC)\]" p.log || true
          if grep -qE "=== [1-9][0-9]* échec\(s\)" p.log; then
            echo "::error::La progression ne survit pas à un redémarrage."
            exit 1
          fi
          echo "Sauvegarde conforme."

  # --- EXPORT ------------------------------------------------------------
  construire:
    needs: [verifier, sauvegarde]
    runs-on: ubuntu-latest
    name: Export web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/moteur
      - name: Exporter en WebAssembly
        run: |
          set -euo pipefail
          mkdir -p web
          ~/godot-bin/godot --headless --path arena-rush --export-release "Web"
          test -f web/index.wasm || { echo "::error::Export web absent."; exit 1; }
          touch web/.nojekyll
          ls -lh web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    name: Déploiement
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Afficher le lien
        run: |
          echo "### 🎮 Jeu publié" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
