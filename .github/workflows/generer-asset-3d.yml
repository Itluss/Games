# GÉNÉRATION D'ASSETS 3D — Meshy.
#
# POURQUOI UN WORKFLOW ET PAS UN APPEL DIRECT : la clé d'API vit dans les
# secrets du dépôt, qui sont EN ÉCRITURE SEULE. Leur valeur n'est
# déchiffrée que par un runner Actions, jamais lisible depuis l'extérieur.
# Le runner est donc le seul endroit d'où l'on peut appeler Meshy.
#
# PRÉREQUIS : Settings → Secrets and variables → Actions → New repository
# secret, nommé MESHY_API_KEY.
#
# Lancement : onglet Actions → « Générer un asset 3D (Meshy) » → Run.
name: Générer un asset 3D (Meshy)

on:
  # Deux façons de lancer une génération.
  #
  # 1. À la main, depuis l'onglet Actions.
  # 2. En déposant un « bon de commande » dans art/requests/. Déclencher un
  #    workflow par l'API demande un droit que tous les jetons n'ont pas ;
  #    un push, lui, passe toujours. Le fichier de demande sert alors à la
  #    fois d'ordre et de trace des réglages employés.
  #
  # SEULES LES DEMANDES AJOUTÉES par le commit déclencheur sont traitées.
  # Rejouer un ancien commit ne regénère donc rien, et ne consomme aucun
  # crédit en double.
  push:
    branches: [main]
    paths:
      - "art/requests/**"
  workflow_dispatch:
    inputs:
      nom:
        description: "Nom du fichier produit (sans extension)"
        required: true
        default: "heros"
      mode:
        description: "image = depuis une planche · texte = depuis une description · texture = retexturer un .glb existant"
        required: true
        default: "texte"
        type: choice
        options: [texte, image, texture]
      prompt:
        description: "Description du sujet (anglais de préférence)"
        required: false
        default: "stocky arena fighter with a visor helmet and shoulder pads"
      image:
        description: "Chemin d'une image de référence versionnée (mode image)"
        required: false
        default: ""
      modele_url:
        description: "URL publique du .glb à retexturer (mode texture)"
        required: false
        default: ""
      polycount:
        description: "Budget de triangles"
        required: false
        default: "30000"
      branche:
        description: "Branche où déposer l'asset produit"
        required: false
        default: "assets-3d"

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deux commits sont nécessaires pour comparer et repérer les
          # demandes réellement ajoutées.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Garde-fou explicite : sans clé, on échoue avec un message lisible
      # plutôt qu'avec une erreur d'authentification obscure.
      - name: Vérifier la clé d'API
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          if [ -z "$MESHY_API_KEY" ]; then
            echo "::error::Le secret MESHY_API_KEY est absent de ce dépôt."
            echo "Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Clé présente (${#MESHY_API_KEY} caractères)."

      # Appel de LISTE, gratuit : valide la clé sans consommer de crédit.
      # Découvrir une clé morte après une génération coûte un run entier.
      - name: Préflight (gratuit)
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: python3 outils/meshy.py --verifier

      - name: Relever les demandes ajoutées
        id: demandes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          # Un premier push sur une branche neuve n'a pas de parent
          # exploitable : on retombe alors sur le commit précédent.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -n "$BASE" ]; then
            # `--no-renames` est indispensable : sans lui, git voit le
            # remplacement d'une demande par une autre comme un RENOMMAGE,
            # que le filtre « ajouté » exclut. Le workflow réussissait
            # alors sans rien générer — un succès trompeur, bien pire
            # qu'un échec.
            FICHIERS=$(git diff --name-only --no-renames --diff-filter=A \
              "$BASE" "${{ github.sha }}" -- 'art/requests/*.json' | tr '\n' ' ')
          else
            FICHIERS=""
          fi
          echo "Demandes à traiter : ${FICHIERS:-aucune}"
          # Un push qui touche art/requests/ sans qu'aucune demande ne soit
          # retenue signale un problème de détection, pas une absence de
          # travail. On le dit haut et fort plutôt que de finir en vert.
          if [ -z "$FICHIERS" ]; then
            echo "::warning::Aucune demande ajoutée détectée alors que le push touche art/requests/ — vérifier la détection avant de conclure."
          fi
          echo "fichiers=$FICHIERS" >> "$GITHUB_OUTPUT"

      - name: Générer depuis les demandes
        if: github.event_name == 'push' && steps.demandes.outputs.fichiers != ''
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: python3 outils/lancer_generation.py ${{ steps.demandes.outputs.fichiers }}

      - name: Générer
        if: github.event_name == 'workflow_dispatch'
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--mode "${{ inputs.mode }}" --nom "${{ inputs.nom }}")
          [ -n "${{ inputs.prompt }}" ] && ARGS+=(--prompt "${{ inputs.prompt }}")
          [ -n "${{ inputs.image }}" ] && ARGS+=(--image "${{ inputs.image }}")
          [ -n "${{ inputs.modele_url }}" ] && ARGS+=(--modele-url "${{ inputs.modele_url }}")
          ARGS+=(--polycount "${{ inputs.polycount }}")
          python3 outils/meshy.py "${ARGS[@]}"

      - name: Inspecter le modèle produit
        run: |
          pip install --quiet trimesh numpy
          python3 - <<'PY'
          import glob, trimesh
          for f in glob.glob("arena-rush/assets/models/*.glb"):
              s = trimesh.load(f)
              geoms = s.geometry.values() if hasattr(s, "geometry") else []
              tris = sum(len(g.faces) for g in geoms)
              b = s.bounds
              print("%s : %d triangles, %d matériaux" % (f, tris, len(list(geoms))))
              print("  dimensions %.2f x %.2f x %.2f" % tuple(b[1] - b[0]))
          PY

      # L'ARTEFACT D'ABORD : quoi qu'il arrive ensuite, le modèle produit
      # est récupérable. Une génération PAYÉE ne doit jamais être perdue
      # parce qu'une étape git a échoué — c'est arrivé sur un autre dépôt.
      - uses: actions/upload-artifact@v4
        with:
          name: asset-3d-${{ inputs.nom || 'lot' }}
          path: arena-rush/assets/models/
          retention-days: 14

      - name: Déposer l'asset sur la branche
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ inputs.branche || 'assets-3d' }}" || true
          git checkout -B "${{ inputs.branche || 'assets-3d' }}"
          git add arena-rush/assets/models/
          git commit -m "Assets 3D générés (${{ github.event_name }})" || {
            echo "::warning::Aucun changement à commiter."; exit 0; }
          git push -u origin "${{ inputs.branche || 'assets-3d' }}" --force
